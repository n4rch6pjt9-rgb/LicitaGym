# Catálogo de tarefas do FORNECEDOR — Lei 14.133/2021 (v1)
# Fonte de verdade do seed. Gerar SQL: python scripts/gerar_seed_catalogo_tarefas.py
#
# Convenções
#   codigo:  14133-Fxx-Tyy (estável; nunca reaproveitar código de tarefa desativada)
#   prazo:   {qtd, unidade, sentido, evento}  unidade ∈ dias_uteis|dias_corridos|meses|anos|imediato|definido_no_edital|sem_prazo_legal
#            sentido ∈ antes_de|apos|ate (antes_de = "até N dias antes do evento")
#   condicao: chave -> valor | [valores]. Chaves do contexto do certame:
#     inversao_fases (bool)          objeto (bens|servicos|obra_engenharia)
#     modo_disputa (aberto|fechado|aberto_fechado)      srp (bool)
#     garantia_proposta (bool)       garantia_contratual (bool)
#     vistoria_prevista (bool)       intervalo_minimo_lances (bool)
#     posicao (vencedor|remanescente) servico_continuo (bool)
#     mao_de_obra_exclusiva (bool)   me_epp (bool)   estrangeira (bool)
#     reforma (bool)                 empate (bool)   diferenca_5pct_segundo (bool)
#     proposta_abaixo_85pct (bool)   classificacao_catalogo_valida
#   base_legal: [artigo, "dispositivo", papel]  papel ∈ fundamento|prazo|consequencia|referencia

norma: LEI_14133_2021

fases:
  - {codigo: F01, ordem: 1, macro: certame, nome: Divulgação do edital, artigos: [17, 54, 55, 164],
     descricao: "Edital publicado no PNCP e prazo de propostas correndo. Fase de leitura, esclarecimento, impugnação e preparo da proposta."}
  - {codigo: F02, ordem: 2, macro: certame, nome: Propostas e lances, artigos: [17, 56, 57, 58, 60],
     descricao: "Sessão pública aberta: envio de propostas, disputa de lances e desempate."}
  - {codigo: F03, ordem: 3, macro: certame, nome: Julgamento, artigos: [17, 59, 61],
     descricao: "Análise de aceitabilidade e exequibilidade da proposta mais bem classificada e negociação."}
  - {codigo: F04, ordem: 4, macro: certame, nome: Habilitação, artigos: [17, 62, 63, 64, 67, 69],
     descricao: "Entrega e análise dos documentos de habilitação (em regra só do vencedor). Com inversão de fases (art. 17 §1º) vem antes da F02."}
  - {codigo: F05, ordem: 5, macro: certame, nome: Recursal, artigos: [17, 165, 168],
     descricao: "Fase recursal única: intenção imediata, razões, contrarrazões e decisão."}
  - {codigo: F06, ordem: 6, macro: certame, nome: Homologação, artigos: [17, 54, 71],
     descricao: "Autoridade superior sanea, revoga, anula ou adjudica e homologa."}
  - {codigo: F07, ordem: 7, macro: contrato, nome: Contratação, artigos: [58, 90, 94, 96, 97, 98],
     descricao: "Convocação para assinar, garantia contratual, remanescentes e eficácia do contrato."}
  - {codigo: F08, ordem: 8, macro: contrato, nome: Execução, artigos: [115, 117, 119, 120, 121, 123, 140, 141, 143],
     descricao: "Execução, fiscalização, recebimento e pagamento."}
  - {codigo: F09, ordem: 9, macro: contrato, nome: Alteração e equilíbrio, artigos: [92, 107, 124, 125, 130, 131, 134, 135],
     descricao: "Aditivos, reajuste, repactuação, reequilíbrio e prorrogação."}
  - {codigo: F10, ordem: 10, macro: contrato, nome: Extinção do contrato, artigos: [90, 100, 137, 138],
     descricao: "Extinção por iniciativa do contratado, unilateral ou consensual, e devolução de garantias."}
  - {codigo: F11, ordem: null, macro: transversal, nome: Processo sancionatório, artigos: [155, 156, 157, 158, 161, 163, 166, 167],
     descricao: "Defesa, recurso e reabilitação quando o fornecedor é acusado de infração. Pode abrir em qualquer fase."}
  - {codigo: F12, ordem: null, macro: transversal, nome: Ata de registro de preços, artigos: [82, 83, 84, 86],
     descricao: "Compromisso de fornecimento e adesões enquanto a ata estiver vigente."}

