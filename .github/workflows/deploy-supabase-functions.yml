# Deploy Edge Functions quando o CLI local retorna 403 (Management API).
# GitHub → Settings → Secrets → SUPABASE_ACCESS_TOKEN (sbp_... da conta Owner)
# Sem `uses:` de marketplace — evita falso positivo do validador offline do IDE.
#
# Como atualizar SUPABASE_CLI_VERSION e SUPABASE_CLI_SHA256:
# 1. Consulte a release estável desejada em https://github.com/supabase/cli/releases
# 2. Baixe ou visualize o arquivo oficial checksums.txt daquela release (ex.:
#    curl -fsSL https://github.com/supabase/cli/releases/download/v<versao>/checksums.txt)
# 3. Localize o hash sha256 correspondente a `supabase_<versao>_linux_amd64.tar.gz`
# 4. Atualize SUPABASE_CLI_VERSION (sem o prefixo 'v') e SUPABASE_CLI_SHA256 simultaneamente abaixo.
# 5. Atualize também SUPABASE_CLI_NPM_SHA256 (fonte alternativa, usada quando o GitHub Releases responde 5xx):
#    curl -fsSL -o cli.tgz https://registry.npmjs.org/@supabase/cli-linux-x64/-/cli-linux-x64-<versao>.tgz
#    confira que `openssl dgst -sha512 -binary cli.tgz | base64 -w0` é igual ao `dist.integrity` de
#    `npm view @supabase/cli-linux-x64@<versao> dist.integrity`, e grave `sha256sum cli.tgz`.
#    O binário bin/supabase desse pacote é o mesmo do tar.gz da release (conferido em 09/11/2026 na 2.118.0).

name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ifaiagegyicjzlpskafh
      SUPABASE_CLI_VERSION: "2.118.0"
      SUPABASE_CLI_SHA256: "f6089a86fb9d9221c958193a277338daddd6822f706929943812fa32e106c86d"
      SUPABASE_CLI_NPM_SHA256: "43992b1cd10872fa8078695fb71db93fbf6ace4f21c34a96a27544076b0d42a3"

    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${REPOSITORY}.git"
          git fetch --depth 1 origin "${REF}"
          git checkout FETCH_HEAD

      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          # Fonte 1: release do GitHub. Fonte 2 (GitHub Releases fora, ex.: 504 em 09/11/2026): o mesmo binário no
          # pacote npm @supabase/cli-linux-x64. Cada fonte tem o próprio SHA-256 fixado; nada roda sem conferir.
          CLI_URL="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          NPM_URL="https://registry.npmjs.org/@supabase/cli-linux-x64/-/cli-linux-x64-${SUPABASE_CLI_VERSION}.tgz"
          mkdir -p /tmp/supabase-cli
          if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -o /tmp/supabase-cli.tgz "$CLI_URL"; then
            echo "${SUPABASE_CLI_SHA256}  /tmp/supabase-cli.tgz" | sha256sum -c -
            tar -xzf /tmp/supabase-cli.tgz -C /tmp/supabase-cli
            BIN=/tmp/supabase-cli/supabase
          else
            echo "::warning::GitHub Releases indisponível; usando o pacote npm @supabase/cli-linux-x64@${SUPABASE_CLI_VERSION}."
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/supabase-cli-npm.tgz "$NPM_URL"
            echo "${SUPABASE_CLI_NPM_SHA256}  /tmp/supabase-cli-npm.tgz" | sha256sum -c -
            tar -xzf /tmp/supabase-cli-npm.tgz -C /tmp/supabase-cli
            BIN=/tmp/supabase-cli/package/bin/supabase
          fi
          sudo install -m 755 "$BIN" /usr/local/bin/supabase
          supabase --version

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID" --yes

      - name: Deploy all functions (no JWT on sync jobs)
        run: |
          FUNCTIONS=(
            sync-pncp-pca
            import-catmat-curadoria
            sync-pncp-contratacoes-editais
            sync-pncp-contratacoes-atas
            sync-pncp-contratacoes-contratos
            sync-pncp-catalogo
            sync-compras-catmat
            link-catmat-pca
            link-pca-edital
            sync-pncp-irp
            sync-pncp-orgaos
            # PENDING (not production-ready — do not deploy yet):
            #   discover-piso-pdm — external scrape prototype, no cron auth
            #   sync-comprasgov-consulta — placeholder TODO (77 endpoints not wired)
            api-pncp-pca
            api-pncp-contratacoes
            api-pncp-irp
            api-dashboard-oportunidades
            api-catmat
            api-pipeline
            api-tenant
            api-tarefas
            api-catalogo-ficha
            api-fornecedores-homologados
            api-saude
            api-disputa
            sync-sessao-chat
            api-agentes
            calculate-distance-webrouter
          )

          FAILED=()
          SUCCESS=()
          DASHBOARD_DEPLOYED=false

          echo "Iniciando deploy de ${#FUNCTIONS[@]} Edge Functions..."
          for fn in "${FUNCTIONS[@]}"; do
            echo "----------------------------------------"
            echo "Deploying ${fn}..."
            if supabase functions deploy "${fn}" --no-verify-jwt; then
              echo "✓ ${fn} deploy com sucesso"
              SUCCESS+=("${fn}")
              if [ "${fn}" = "api-dashboard-oportunidades" ]; then
                DASHBOARD_DEPLOYED=true
              fi
              if [ "${fn}" = "api-catmat" ]; then
                CATMAT_DEPLOYED=true
              fi
              if [ "${fn}" = "api-saude" ]; then
                SAUDE_DEPLOYED=true
              fi
              if [ "${fn}" = "api-agentes" ]; then
                AGENTES_DEPLOYED=true
              fi
              if [ "${fn}" = "api-catalogo-ficha" ]; then
                FICHA_DEPLOYED=true
              fi
            else
              echo "✗ ${fn} FALHOU no deploy"
              FAILED+=("${fn}")
            fi
          done

          echo "----------------------------------------"
          echo "Resumo do deploy:"
          echo "Sucesso (${#SUCCESS[@]}): ${SUCCESS[*]}"

          echo "CATMAT_DEPLOYED=${CATMAT_DEPLOYED:-false}" >> "$GITHUB_ENV"
          echo "SAUDE_DEPLOYED=${SAUDE_DEPLOYED:-false}" >> "$GITHUB_ENV"
          echo "AGENTES_DEPLOYED=${AGENTES_DEPLOYED:-false}" >> "$GITHUB_ENV"
          echo "FICHA_DEPLOYED=${FICHA_DEPLOYED:-false}" >> "$GITHUB_ENV"

          if [ "${DASHBOARD_DEPLOYED}" = "true" ]; then
            echo "DASHBOARD_DEPLOYED=true" >> "$GITHUB_ENV"
          else
            echo "DASHBOARD_DEPLOYED=false" >> "$GITHUB_ENV"
          fi

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "FALHAS (${#FAILED[@]}): ${FAILED[*]}"
            echo "FAILED_FUNCTIONS=${FAILED[*]}" >> "$GITHUB_ENV"
          else
            echo "Todas as funções foram publicadas com sucesso!"
          fi

      - name: Smoke test api-dashboard-oportunidades
        if: env.DASHBOARD_DEPLOYED == 'true'
        run: |
          BASE_URL="https://${PROJECT_ID}.supabase.co/functions/v1/api-dashboard-oportunidades"

          echo "Validando readiness (esperado HTTP 200)..."
          READINESS_CODE=$(curl -s -o /tmp/readiness_response.json -w "%{http_code}" "${BASE_URL}?action=readiness")
          echo "HTTP code recebido: ${READINESS_CODE}"
          cat /tmp/readiness_response.json
          echo ""
          if [ "${READINESS_CODE}" -ne 200 ]; then
            echo "Falha no smoke test: endpoint readiness retornou status ${READINESS_CODE}, esperado 200"
            exit 1
          fi

          echo "Validando list sem JWT de usuário (esperado HTTP 401)..."
          LIST_UNAUTH_CODE=$(curl -s -o /tmp/list_unauth_response.json -w "%{http_code}" "${BASE_URL}?action=list")
          echo "HTTP code recebido: ${LIST_UNAUTH_CODE}"
          cat /tmp/list_unauth_response.json
          echo ""
          if [ "${LIST_UNAUTH_CODE}" -ne 401 ]; then
            echo "Falha no smoke test: endpoint list sem autenticacao retornou status ${LIST_UNAUTH_CODE}, esperado 401"
            exit 1
          fi

          echo "Smoke tests passaram com sucesso."

      - name: Smoke test api-catmat
        if: env.CATMAT_DEPLOYED == 'true'
        run: |
          BASE_URL="https://${PROJECT_ID}.supabase.co/functions/v1/api-catmat"
          echo "Validando catalogo_listar sem JWT de usuário (esperado HTTP 401)..."
          CODE=$(curl -s -o /tmp/catmat_unauth.json -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"action":"catalogo_listar"}' "${BASE_URL}")
          echo "HTTP code recebido: ${CODE}"
          cat /tmp/catmat_unauth.json
          echo ""
          if [ "${CODE}" -ne 401 ]; then
            echo "Falha no smoke test: api-catmat sem autenticacao retornou ${CODE}, esperado 401"
            exit 1
          fi
          echo "Smoke test api-catmat passou."

      - name: Smoke test api-catalogo-ficha
        if: env.FICHA_DEPLOYED == 'true'
        run: |
          BASE_URL="https://${PROJECT_ID}.supabase.co/functions/v1/api-catalogo-ficha"
          echo "Validando gravar sem JWT de usuário (esperado HTTP 401)..."
          CODE=$(curl -s -o /tmp/ficha_unauth.json -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"action":"gravar"}' "${BASE_URL}")
          echo "HTTP code recebido: ${CODE}"
          cat /tmp/ficha_unauth.json
          echo ""
          if [ "${CODE}" -ne 401 ]; then
            echo "Falha no smoke test: api-catalogo-ficha sem autenticacao retornou ${CODE}, esperado 401"
            exit 1
          fi
          echo "Smoke test api-catalogo-ficha passou."

      - name: Smoke test api-saude
        if: env.SAUDE_DEPLOYED == 'true'
        run: |
          BASE_URL="https://${PROJECT_ID}.supabase.co/functions/v1/api-saude"
          echo "Validando resumo sem credencial (esperado HTTP 401)..."
          CODE=$(curl -s -o /tmp/saude_unauth.json -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"action":"resumo"}' "${BASE_URL}")
          echo "HTTP code recebido: ${CODE}"
          if [ "${CODE}" -ne 401 ]; then
            echo "Falha no smoke test: api-saude sem autenticacao retornou ${CODE}, esperado 401"
            exit 1
          fi
          echo "Smoke test api-saude passou."

      - name: Report deployment status
        if: always()
        run: |
          if [ -n "${FAILED_FUNCTIONS}" ]; then
            echo "::error::As seguintes funções falharam no deploy: ${FAILED_FUNCTIONS}"
            exit 1
          fi
          if [ "${DASHBOARD_DEPLOYED}" != "true" ]; then
            echo "::error::api-dashboard-oportunidades não foi publicada."
            exit 1
          fi
          if [ "${AGENTES_DEPLOYED:-false}" != "true" ]; then
            echo "::error::api-agentes não foi publicada."
            exit 1
          fi
