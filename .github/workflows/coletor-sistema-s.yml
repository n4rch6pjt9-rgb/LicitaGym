# Coleta recorrente de oportunidades do Sistema S / Paradigma (`python3 -m coletor.paradigma`) no runner do GitHub,
# sem actions de terceiros (regra do repo): checkout por git, Python do runner.
# Grava em licitacoes_externas, licitacao_itens e licitacao_resultados com proveniência `ingestao_origem = cron|manual` (spec 0023).
# Pré-requisitos (secrets do repositório): SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY.
# Roda com `--sem-documentos` no runner (mesmo padrão do Coletor PNCP).
#
# Spec 0064 (13/11/2026): coleta em camadas. A descoberta lista o mural comum inteiro e põe na fila
# (private.coleta_externa_fila) só o processo novo ou que mudou; a carga hidrata a fila com orçamento de tempo e para
# limpo, devolvendo o resto. Interrompida, a próxima execução continua de onde parou. Grupos pela medição de 13/11:
#   - pequenas (até 40 processos: sescdn, findes, sescrj, fiems, sfiec, sescsp, sestsenat): um job, em sequência,
#     `--etapa completa` com 7 min de orçamento cada;
#   - médias (sescba, fiesc, firjan): um job cada, `--etapa completa` com 60 min;
#   - grandes (fieb, sesc_senac_rs): descoberta 1 vez ao dia (06:30) e carga a cada 2 h com 60 min (cron próprio).
# A primeira descoberta de cada portal enche a fila com tudo dos últimos 24 meses: a carga leva alguns dias para
# esvaziá-la (o orçamento de cada execução vale; o que sobrar fica para a próxima).
# Fontes fora do lote: fiemg (WAF 403), fiergs (host responde HTTP 403 ao runner desde 08/11/2026) e fiemt (o host
# não aceita conexão do runner, run 42553197711, 09/11/2026): só disparo manual, para conferir se voltaram.
# Saída sem buffer (PYTHONUNBUFFERED) e timeout interno abaixo do limite do job: o progresso aparece no log e, no
# limite, o coletor recebe SIGTERM, devolve o lote à fila e fecha o registro em coleta_externa_run.
# Cada execução agendada fica registrada em private.coleta_externa_run (modo leads, descoberta ou carga), que a saúde
# operacional lê (coleta_externa_dias_sem_sucesso, coleta_externa_executando_horas, coleta_externa_fila_pendente_horas).
name: Coletor Sistema S

on:
  schedule:
    - cron: "30 9 * * *"    # 06:30 em Brasília: pequenas, médias e a descoberta das grandes
    - cron: "15 */2 * * *"  # a cada 2 h: carga das grandes (fieb, sesc_senac_rs)
  workflow_dispatch:
    inputs:
      fonte:
        description: "todas (lote diário) | sestsenat | fiesc | firjan | fiergs | findes | fieb | fiems | fiemt | sfiec | sescsp | sesc_senac_rs | sescdn | sescrj | sescba"
        default: "todas"
        required: false
      etapa:
        description: "Uma fonte: completa (descoberta + carga) | descoberta (mural -> fila) | carga (fila -> hidratação)"
        default: "completa"
        required: false
      orcamento:
        description: "Uma fonte: minutos de carga antes de parar limpo (vazio = até o limite do job)"
        default: ""
        required: false
      paginas:
        description: "Teto opcional de páginas de até 100 itens da listagem (vazio = mural inteiro)"
        default: ""
        required: false
      documentos:
        description: "Habilitar coleta documental manual"
        type: boolean
        default: false
        required: false
      dry_run:
        description: "true = só consulta, não grava (coleta por termo, sem fila; etapa completa)"
        default: "false"
        required: false
      processos:
        description: "Só estes processos (nCdOrigem ou nCdOrigem/MODULO, separados por espaço), sem listar nem usar a fila; exige uma fonte"
        default: ""
        required: false

permissions:
  contents: read

# A carga das grandes tem grupo próprio: não fica na fila atrás do lote diário (nem o substitui).
concurrency:
  group: coletor-sistema-s-${{ github.event.schedule == '15 */2 * * *' && 'carga-grandes' || 'lote' }}
  cancel-in-progress: false

jobs:
  plano:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      grupos: ${{ steps.grupos.outputs.grupos }}
    steps:
      - name: Grupos
        id: grupos
        env:
          AGENDA: ${{ github.event.schedule || '' }}
          FONTE: ${{ github.event.inputs.fonte || 'todas' }}
          ETAPA: ${{ github.event.inputs.etapa || 'completa' }}
          ORCAMENTO: ${{ github.event.inputs.orcamento || '' }}
          PROCESSOS: ${{ github.event.inputs.processos || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          # Cada grupo: {nome, fontes (separadas por espaço), etapa, orcamento (min por fonte, vazio = sem), limite}.
          # limite = timeout interno de cada fonte; a soma do grupo fica abaixo dos 75 min do job.
          PEQUENAS='{"nome":"pequenas","fontes":"sescdn findes sescrj fiems sfiec sescsp sestsenat","etapa":"completa","orcamento":"7","limite":"9m"}'
          MEDIAS='{"nome":"sescba","fontes":"sescba","etapa":"completa","orcamento":"60","limite":"66m"},{"nome":"fiesc","fontes":"fiesc","etapa":"completa","orcamento":"60","limite":"66m"},{"nome":"firjan","fontes":"firjan","etapa":"completa","orcamento":"60","limite":"66m"}'
          GRANDES_DESC='{"nome":"fieb (descoberta)","fontes":"fieb","etapa":"descoberta","orcamento":"","limite":"70m"},{"nome":"sesc_senac_rs (descoberta)","fontes":"sesc_senac_rs","etapa":"descoberta","orcamento":"","limite":"70m"}'
          GRANDES_CARGA='{"nome":"fieb (carga)","fontes":"fieb","etapa":"carga","orcamento":"60","limite":"66m"},{"nome":"sesc_senac_rs (carga)","fontes":"sesc_senac_rs","etapa":"carga","orcamento":"60","limite":"66m"}'

          if [ "${AGENDA}" = "15 */2 * * *" ]; then
            GRUPOS="[${GRANDES_CARGA}]"
          elif [ -n "${AGENDA}" ] || [ "${FONTE}" = "todas" ] || [ -z "${FONTE}" ]; then
            # Lista de processos é de uma fonte só: o nCdOrigem não identifica processo entre portais.
            if [ -n "${PROCESSOS}" ]; then
              echo "A entrada processos exige uma fonte (não 'todas')." >&2
              exit 1
            fi
            # dry_run não usa a fila: o lote com dry_run roda só a coleta por termo (etapa completa) de cada fonte.
            if [ "${DRY_RUN}" = "true" ]; then
              GRANDES_DESC='{"nome":"fieb","fontes":"fieb","etapa":"completa","orcamento":"","limite":"70m"},{"nome":"sesc_senac_rs","fontes":"sesc_senac_rs","etapa":"completa","orcamento":"","limite":"70m"}'
            fi
            GRUPOS="[${PEQUENAS},${MEDIAS},${GRANDES_DESC}]"
          else
            case "${FONTE}" in
              sestsenat|fiesc|firjan|fiergs|findes|fieb|fiems|fiemt|sfiec|sescsp|sesc_senac_rs|sescdn|sescrj|sescba) ;;
              *) echo "Fonte desconhecida ou bloqueada por WAF." >&2; exit 1 ;;
            esac
            case "${ETAPA}" in
              completa|descoberta|carga) ;;
              *) echo "Etapa inválida (completa, descoberta ou carga)." >&2; exit 1 ;;
            esac
            if [ "${ETAPA}" != "completa" ] && { [ -n "${PROCESSOS}" ] || [ "${DRY_RUN}" = "true" ]; }; then
              echo "Etapa ${ETAPA} usa a fila: não combina com processos nem dry_run." >&2
              exit 1
            fi
            if [ -n "${ORCAMENTO}" ] && ! [[ "${ORCAMENTO}" =~ ^[1-9][0-9]?$ ]] ; then
              echo "Orçamento inválido (minutos, 1 a 99)." >&2
              exit 1
            fi
            if [ -n "${ORCAMENTO}" ] && [ "${ORCAMENTO}" -gt 66 ]; then
              echo "Orçamento acima de 66 min não cabe no limite de 70 min do job." >&2
              exit 1
            fi
            GRUPOS="[{\"nome\":\"${FONTE}\",\"fontes\":\"${FONTE}\",\"etapa\":\"${ETAPA}\",\"orcamento\":\"${ORCAMENTO}\",\"limite\":\"70m\"}]"
          fi
          echo "grupos=${GRUPOS}" >> "${GITHUB_OUTPUT}"
          echo "agenda '${AGENDA}', fonte ${FONTE}: ${GRUPOS}"

  coletar:
    needs: plano
    name: coletar (${{ matrix.grupo.nome }})
    runs-on: ubuntu-latest
    timeout-minutes: 75   # cada grupo cabe em 70 min (orçamento + limite interno por fonte)
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        grupo: ${{ fromJSON(needs.plano.outputs.grupos) }}
    env:
      DELAY_SEGUNDOS: "1.5"
      PYTHONUNBUFFERED: "1"
      FONTES: ${{ matrix.grupo.fontes }}
      ETAPA: ${{ matrix.grupo.etapa }}
      ORCAMENTO: ${{ matrix.grupo.orcamento }}
      LIMITE_ETAPA: ${{ matrix.grupo.limite }}
      PAGINAS: ${{ github.event.inputs.paginas || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      DOCUMENTOS_HABILITADOS: ${{ github.event_name == 'workflow_dispatch' && inputs.documentos == true }}
      ORIGEM: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      PROCESSOS: ${{ github.event.inputs.processos || '' }}
    steps:
      - name: Checkout (git, sem actions de terceiros)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD -- services/coletor-externo
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Conferir segredos
        env:
          TEM_URL: ${{ secrets.SUPABASE_URL != '' }}
          TEM_CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          if [ "${TEM_URL}" != "true" ] || [ "${TEM_CHAVE}" != "true" ]; then
            echo "Secrets SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY ausentes no repositório."; exit 1
          fi

      - name: Dependências
        working-directory: services/coletor-externo
        run: |
          python3 --version
          python3 -m pip install --quiet --disable-pip-version-check --only-binary :all: -r requirements.txt

      - name: Coleta
        working-directory: services/coletor-externo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          # Cadastro de visitante nos portais (decisões de 09/11 e 12/11/2026): CNPJ + razão social da empresa, ou
          # CPF + nome de uma pessoa, sempre com VISITANTE_CONSENTIMENTO_LGPD=1. Sem os secrets, documento que exige
          # cadastro fica pendente. Só tem efeito com documentos habilitados.
          # UF e consentimento vêm de Variables (não são sensíveis): como secret, o Actions esconderia todo "1" e a sigla
          # da UF em todo o log (run 43324762704).
          VISITANTE_CNPJ: ${{ secrets.VISITANTE_CNPJ }}
          VISITANTE_RAZAO_SOCIAL: ${{ secrets.VISITANTE_RAZAO_SOCIAL }}
          VISITANTE_CPF: ${{ secrets.VISITANTE_CPF }}
          VISITANTE_NOME: ${{ secrets.VISITANTE_NOME }}
          VISITANTE_EMAIL: ${{ secrets.VISITANTE_EMAIL }}
          VISITANTE_TELEFONE: ${{ secrets.VISITANTE_TELEFONE }}
          VISITANTE_UF: ${{ vars.VISITANTE_UF }}
          VISITANTE_CONTATO: ${{ secrets.VISITANTE_CONTATO }}
          VISITANTE_CONSENTIMENTO_LGPD: ${{ vars.VISITANTE_CONSENTIMENTO_LGPD }}
          # Com CPF: chave do HMAC que identifica o cadastro em portal_visitante (o CPF não vai para o banco).
          VISITANTE_HASH_CHAVE: ${{ secrets.VISITANTE_HASH_CHAVE }}
          # Endereço do visitante (spec 0061, K-13): opcional, mas todos juntos quando vier. O código da cidade é
          # buscado pelo nome na lista do próprio portal (PesquisarRegiao). RG só com CPF.
          VISITANTE_ENDERECO: ${{ secrets.VISITANTE_ENDERECO }}
          VISITANTE_NUMERO: ${{ secrets.VISITANTE_NUMERO }}
          VISITANTE_BAIRRO: ${{ secrets.VISITANTE_BAIRRO }}
          VISITANTE_CEP: ${{ secrets.VISITANTE_CEP }}
          VISITANTE_CIDADE: ${{ secrets.VISITANTE_CIDADE }}
          VISITANTE_RG: ${{ secrets.VISITANTE_RG }}
        run: |
          # O Actions só mascara o valor exato do secret; o coletor usa CPF, RG e CEP só com dígitos e manda o CEP com
          # a máscara 99.999-999. Mascara também essas formas.
          if [ -n "${VISITANTE_CPF:-}" ]; then
            echo "::add-mask::${VISITANTE_CPF//[!0-9]/}"
          fi
          if [ -n "${VISITANTE_RG:-}" ]; then
            RG_LIMPO="${VISITANTE_RG//[!0-9Xx]/}"
            echo "::add-mask::${RG_LIMPO^^}"
          fi
          CEP_DIGITOS="${VISITANTE_CEP//[!0-9]/}"
          if [ "${#CEP_DIGITOS}" -eq 8 ]; then
            echo "::add-mask::${CEP_DIGITOS}"
            echo "::add-mask::${CEP_DIGITOS:0:2}.${CEP_DIGITOS:2:3}-${CEP_DIGITOS:5:3}"
          fi
          ARGS=(--origem "${ORIGEM}" --etapa "${ETAPA}")
          if [ "${DOCUMENTOS_HABILITADOS}" != "true" ]; then
            ARGS+=(--sem-documentos)
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            # dry-run não usa a fila: coleta por termo, sem orçamento, com teto de 3 páginas por termo se nada vier
            PAGINAS="${PAGINAS:-3}"
          elif [ -n "${ORCAMENTO}" ]; then
            ARGS+=(--orcamento-minutos "${ORCAMENTO}")
          fi
          if [ -n "${PAGINAS}" ]; then
            if ! [[ "${PAGINAS}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Páginas inválido (inteiro >= 1)." >&2
              exit 1
            fi
            ARGS+=(--paginas "${PAGINAS}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          # Camada 3 sob demanda: só estes processos, sem a listagem nem a fila. Cada ID é validado antes de virar
          # argumento (a entrada vem do disparo manual e só chega aqui pela variável de ambiente).
          set -f   # sem expansão de glob: um '*' na entrada não vira nome de arquivo antes da validação
          for p in ${PROCESSOS}; do
            if ! [[ "${p}" =~ ^[1-9][0-9]*(/[1-9][0-9]*)?$ ]]; then
              echo "Processo inválido (use nCdOrigem ou nCdOrigem/MODULO)." >&2
              exit 1
            fi
            ARGS+=(--processo "${p}")
          done
          if [ "${DOCUMENTOS_HABILITADOS}" = "true" ] && [ -z "${SUPABASE_STORAGE_BUCKET:-}" ]; then
            echo "SUPABASE_STORAGE_BUCKET ausente."; exit 1
          fi
          # Uma fonte por vez no grupo; a falha de uma não impede as outras, mas o job termina com erro.
          FALHAS=""
          for FONTE in ${FONTES}; do
            echo "::group::${FONTE} (${ETAPA}${ORCAMENTO:+, ${ORCAMENTO} min})"
            # O limite interno fica abaixo do job: o SIGTERM chega ao Python, que devolve o lote e fecha o registro.
            if ! timeout --kill-after=1m "${LIMITE_ETAPA:-70m}" python3 -m coletor.paradigma --fonte "${FONTE}" "${ARGS[@]}"; then
              FALHAS="${FALHAS} ${FONTE}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${FALHAS}" ]; then
            echo "Fontes com falha:${FALHAS}" >&2
            exit 1
          fi
