# Deploy Edge Functions quando o CLI local retorna 403 (Management API).
# GitHub → Settings → Secrets → SUPABASE_ACCESS_TOKEN (sbp_... da conta Owner)
# Sem `uses:` de marketplace — evita falso positivo do validador offline do IDE.
#
# Como atualizar SUPABASE_CLI_VERSION e SUPABASE_CLI_SHA256:
# 1. Consulte a release estável desejada em https://github.com/supabase/cli/releases
# 2. Baixe ou visualize o arquivo oficial checksums.txt daquela release (ex.:
#    curl -fsSL https://github.com/supabase/cli/releases/download/v<versao>/checksums.txt)
# 3. Localize o hash sha256 correspondente a `supabase_<versao>_linux_amd64.tar.gz`
# 4. Atualize SUPABASE_CLI_VERSION (sem o prefixo 'v') e SUPABASE_CLI_SHA256 simultaneamente abaixo.

name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ifaiagegyicjzlpskafh
      SUPABASE_CLI_VERSION: "2.118.0"
      SUPABASE_CLI_SHA256: "f6089a86fb9d9221c958193a277338daddd6822f706929943812fa32e106c86d"

    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${REPOSITORY}.git"
          git fetch --depth 1 origin "${REF}"
          git checkout FETCH_HEAD

      - name: Install Supabase CLI
        run: |
          CLI_URL="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/supabase-cli.tgz "$CLI_URL"
          echo "${SUPABASE_CLI_SHA256}  /tmp/supabase-cli.tgz" | sha256sum -c -
          mkdir -p /tmp/supabase-cli
          tar -xzf /tmp/supabase-cli.tgz -C /tmp/supabase-cli
          sudo install -m 755 /tmp/supabase-cli/supabase /usr/local/bin/supabase
          supabase --version

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID" --yes

      - name: Deploy all functions (no JWT on sync jobs)
        run: |
          supabase functions deploy sync-pncp-pca --no-verify-jwt
          supabase functions deploy import-catmat-curadoria --no-verify-jwt
          supabase functions deploy sync-pncp-legislation --no-verify-jwt
          supabase functions deploy sync-pncp-contratacoes-editais --no-verify-jwt
          supabase functions deploy sync-pncp-contratacoes-atas --no-verify-jwt
          supabase functions deploy sync-pncp-contratacoes-contratos --no-verify-jwt
          supabase functions deploy sync-pncp-catalogo --no-verify-jwt
          supabase functions deploy sync-compras-catmat --no-verify-jwt
          supabase functions deploy link-catmat-pca --no-verify-jwt
          supabase functions deploy sync-pncp-irp --no-verify-jwt
          supabase functions deploy sync-pncp-orgaos --no-verify-jwt
          # PENDING (not production-ready — do not deploy yet):
          #   discover-piso-pdm — external scrape prototype, no cron auth
          #   sync-comprasgov-consulta — placeholder TODO (77 endpoints not wired)
          supabase functions deploy api-pncp-pca --no-verify-jwt
          supabase functions deploy api-pncp-legislacao --no-verify-jwt
          supabase functions deploy api-pncp-contratacoes --no-verify-jwt
          supabase functions deploy api-pncp-irp --no-verify-jwt
          supabase functions deploy api-dashboard-oportunidades --no-verify-jwt
          supabase functions deploy calculate-distance-webrouter --no-verify-jwt

      - name: Smoke test api-dashboard-oportunidades
        run: |
          BASE_URL="https://${PROJECT_ID}.supabase.co/functions/v1/api-dashboard-oportunidades"

          echo "Validando readiness (esperado HTTP 200)..."
          READINESS_CODE=$(curl -s -o /tmp/readiness_response.json -w "%{http_code}" "${BASE_URL}?action=readiness")
          echo "HTTP code recebido: ${READINESS_CODE}"
          cat /tmp/readiness_response.json
          echo ""
          if [ "${READINESS_CODE}" -ne 200 ]; then
            echo "Falha no smoke test: endpoint readiness retornou status ${READINESS_CODE}, esperado 200"
            exit 1
          fi

          echo "Validando list sem JWT de usuário (esperado HTTP 401)..."
          LIST_UNAUTH_CODE=$(curl -s -o /tmp/list_unauth_response.json -w "%{http_code}" "${BASE_URL}?action=list")
          echo "HTTP code recebido: ${LIST_UNAUTH_CODE}"
          cat /tmp/list_unauth_response.json
          echo ""
          if [ "${LIST_UNAUTH_CODE}" -ne 401 ]; then
            echo "Falha no smoke test: endpoint list sem autenticacao retornou status ${LIST_UNAUTH_CODE}, esperado 401"
            exit 1
          fi

          echo "Smoke tests passaram com sucesso."
