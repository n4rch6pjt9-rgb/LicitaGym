name: PCA Harness - Deno

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/_shared/pncp/**"
      - "supabase/functions/sync-pncp-pca/**"
      - "tests/supabase/functions/**"
      - ".github/workflows/pca-harness.yml"

permissions:
  contents: read

# Mesmo runtime e checksum usados em pr-quality.yml.
env:
  DENO_VERSION: "2.9.6"
  DENO_SHA256: "394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2"
  NO_COLOR: "1"

jobs:
  pca-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
 ci/pca-harness-fix
      - name: Checkout sem Actions externas
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Checkout (git, sem actions de terceiros)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Instalar Deno (release oficial, SHA-256 conferido)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/pca-deno.zip" "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip" \
            || curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/pca-deno.zip" "https://dl.deno.land/release/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/pca-deno.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pca-deno"
          unzip -q -o "$RUNNER_TEMP/pca-deno.zip" -d "$RUNNER_TEMP/pca-deno"
          echo "$RUNNER_TEMP/pca-deno" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pca-deno/deno" --version
 main

      - name: Instalar Deno 2.9.8 com SHA-256
        run: |
          set -euo pipefail
          DENO_VERSION="2.9.8"
          DENO_SHA256="e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609"
          DENO_ARCHIVE="deno-x86_64-unknown-linux-gnu.zip"
          DENO_URL="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/${DENO_ARCHIVE}"

          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/$DENO_ARCHIVE" "$DENO_URL"

          echo "$DENO_SHA256  $RUNNER_TEMP/$DENO_ARCHIVE" | sha256sum --check -

          mkdir -p "$RUNNER_TEMP/deno-bin"
          unzip -q "$RUNNER_TEMP/$DENO_ARCHIVE" -d "$RUNNER_TEMP/deno-bin"
          echo "$RUNNER_TEMP/deno-bin" >> "$GITHUB_PATH"

      - name: Verificar Deno
        run: |
          deno --version
          test "$(deno --version | head -n 1)" = "deno 2.9.8 (stable, release, x86_64-unknown-linux-gnu)"

      - name: PCA - fila, lote e historico
        run: |
          deno test --node-modules-dir=none --allow-env --allow-read \
            tests/supabase/functions/sync_pncp_pca_fila_test.ts \
            tests/supabase/functions/sync_pncp_pca_lote_test.ts \
            tests/supabase/functions/pca_historico_test.ts

      - name: PCA - contratos atomicos e retomada
        run: |
          deno test --node-modules-dir=none --allow-env --allow-read \
            tests/supabase/functions/pca_atomico_test.ts \
            tests/supabase/functions/pca_rpc_atomico_integracao_test.ts \
            tests/supabase/functions/fake_pca_atomico_test.ts \
            tests/supabase/functions/_shared/pncp/pncp_upsert_historico_falha_test.ts \
            tests/supabase/functions/sync_pncp_pca_legado_test.ts
