name: PCA Harness - Deno

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/_shared/pncp/**"
      - "supabase/functions/sync-pncp-pca/**"
      - "tests/supabase/functions/**"
      - ".github/workflows/pca-harness.yml"

permissions:
  contents: read

jobs:
  pca-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sem Actions externas
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Instalar Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Verificar Deno
        run: deno --version

      - name: PCA - fila, lote e historico
        run: |
          deno test --node-modules-dir=none --allow-env --allow-read \
            tests/supabase/functions/sync_pncp_pca_fila_test.ts \
            tests/supabase/functions/sync_pncp_pca_lote_test.ts \
            tests/supabase/functions/pca_historico_test.ts
