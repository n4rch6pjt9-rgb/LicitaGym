tarefas:
  # ============================================================ F01 Divulgação
  - codigo: 14133-F01-T01
    fase: F01
    titulo: Registrar edital e anexos
    natureza: acompanhamento
    ator: licitante
    evento_abertura: EDITAL_PUBLICADO
    prazo: {unidade: sem_prazo_legal}
    descricao: "Baixar o inteiro teor do edital e anexos no PNCP, registrar data de divulgação, data de abertura, critério de julgamento, modo de disputa, exigências de garantia, vistoria e SRP. Alimenta o contexto que libera as demais tarefas."
    saida: Ficha do certame preenchida (contexto)
    base_legal: [[54, "caput", fundamento], [54, "§ 1º", referencia]]
  - codigo: 14133-F01-T02
    fase: F01
    titulo: Conferir prazo mínimo de propostas
    natureza: acompanhamento
    ator: licitante
    evento_abertura: EDITAL_PUBLICADO
    prazo: {unidade: sem_prazo_legal}
    descricao: "Contar os dias úteis entre a divulgação e a abertura. Bens: 8 dias úteis (menor preço/maior desconto) ou 15; serviços comuns 10; especiais 25; integrada 60; semi-integrada 35; maior lance 15; técnica e preço 35. Prazo menor fundamenta impugnação."
    saida: Registro do prazo apurado vs. mínimo legal
    base_legal: [[55, "caput, I a IV", fundamento]]
  - codigo: 14133-F01-T03
    fase: F01
    titulo: Pedir esclarecimento
    natureza: faculdade
    ator: licitante
    evento_abertura: EDITAL_PUBLICADO
    prazo: {qtd: 3, unidade: dias_uteis, sentido: antes_de, evento: DATA_ABERTURA, obs: "Protocolar até 3 dias úteis antes da abertura."}
    consequencia: "Fora do prazo, o pedido pode não ser conhecido."
    descricao: "Protocolar pedido de esclarecimento sobre termos do edital (especificação, quantidade, prazo de entrega, habilitação)."
    saida: Pedido protocolado
    base_legal: [[164, "caput", fundamento], [164, "caput", prazo]]
  - codigo: 14133-F01-T04
    fase: F01
    titulo: Impugnar o edital
    natureza: faculdade
    ator: licitante
    evento_abertura: EDITAL_PUBLICADO
    prazo: {qtd: 3, unidade: dias_uteis, sentido: antes_de, evento: DATA_ABERTURA, obs: "Protocolar até 3 dias úteis antes da abertura."}
    consequencia: "Fora do prazo, a impugnação pode não ser conhecida."
    descricao: "Impugnar edital por irregularidade na aplicação da Lei 14.133 (ex.: prazo menor que o do art. 55, exigência de atestado acima de 50% da parcela relevante, restrição indevida)."
    saida: Petição de impugnação protocolada
    base_legal: [[164, "caput", fundamento], [55, "caput", referencia], [67, "§§ 1º e 2º", referencia]]
  - codigo: 14133-F01-T05
    fase: F01
    titulo: Acompanhar resposta a esclarecimento/impugnação
    natureza: acompanhamento
    ator: licitante
    evento_abertura: RESPOSTA_ESCLARECIMENTO
    prazo: {unidade: sem_prazo_legal, obs: "Prazo é da Administração: responder em até 3 dias úteis, limitado ao último dia útil antes da abertura. Sem resposta até lá, registrar a omissão."}
    descricao: "Ler a resposta e ajustar a proposta. Se a resposta alterar o edital de forma que afete propostas, verificar nova divulgação (T06)."
    depende_de: [[14133-F01-T03, requer]]
    saida: Resposta arquivada e impacto avaliado
    base_legal: [[164, "parágrafo único", prazo]]
  - codigo: 14133-F01-T06
    fase: F01
    titulo: Verificar reabertura de prazo após alteração do edital
    natureza: direito
    ator: licitante
    evento_abertura: EDITAL_ALTERADO
    prazo: {unidade: sem_prazo_legal}
    descricao: "Alteração que comprometa a formulação das propostas exige nova divulgação e novos prazos. Conferir se o órgão reabriu o prazo; se não, fundamenta impugnação."
    saida: Nova data de abertura registrada ou impugnação
    base_legal: [[55, "§ 1º", fundamento]]
  - codigo: 14133-F01-T07
    fase: F01
    titulo: Agendar vistoria ou preparar declaração substitutiva
    natureza: faculdade
    ator: licitante
    evento_abertura: EDITAL_PUBLICADO
    prazo: {unidade: definido_no_edital, obs: "Data e horário conforme edital; a Administração deve oferecer horários diferentes."}
    condicao: {vistoria_prevista: true}
    consequencia: "Sem vistoria nem declaração, inabilitação."
    descricao: "Agendar vistoria prévia ou assinar declaração formal do responsável técnico de pleno conhecimento das condições do local."
    saida: Atestado de vistoria ou declaração assinada
    base_legal: [[63, "§ 2º", fundamento], [63, "§ 3º", fundamento], [63, "§ 4º", referencia]]
  - codigo: 14133-F01-T08
    fase: F01
    titulo: Providenciar garantia de proposta
    natureza: obrigacao
    ator: licitante
    evento_abertura: EDITAL_PUBLICADO
    prazo: {unidade: definido_no_edital, obs: "Comprovar no momento da apresentação da proposta."}
    condicao: {garantia_proposta: true}
    consequencia: "Requisito de pré-habilitação: sem garantia, proposta não segue."
    descricao: "Recolher garantia de até 1% do valor estimado, em caução, seguro-garantia, fiança bancária ou título de capitalização."
    saida: Comprovante de garantia de proposta
    base_legal: [[58, "caput e § 1º", fundamento], [58, "§ 4º", referencia], [96, "§ 1º", referencia]]
  - codigo: 14133-F01-T09
    fase: F01
    titulo: Preparar declarações obrigatórias
    natureza: obrigacao
    ator: licitante
    evento_abertura: EDITAL_PUBLICADO
    prazo: {unidade: definido_no_edital, obs: "Normalmente junto com a proposta."}
    consequencia: "Falta da declaração de custos trabalhistas: desclassificação."
